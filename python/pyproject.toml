[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alq"
version = "0.1.0"
description = "Pipeline de conversão PDF para EPUB do projeto alq-epub-converter"
requires-python = ">=3.12"
dependencies = [
    "ebooklib",
    "pillow",
    "pymupdf",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alq"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "../tests/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["../tests/python"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/alq", "../tests/python"]
strict = true
warn_unused_configs = true
