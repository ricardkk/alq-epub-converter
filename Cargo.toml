[package]
name = "alq-epub-converter"
version = "0.1.0"
edition = "2021"
description = "Conversor de PDF para EPUB com CLI em Rust e pipeline em Python"

[[bin]]
name = "alq"
path = "rust/src/main.rs"

[lib]
name = "alq"
path = "rust/src/lib.rs"

[[test]]
name = "cli_tests"
path = "tests/rust/cli_tests.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
